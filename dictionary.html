<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시사용어사전 - 매십문</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #5bc8f5;
    --pink: #ff6eb4;
    --pink-dark: #d94f96;
    --yellow: #ffd700;
    --yellow-dark: #e6a800;
    --cream: #fff8e7;
    --navy: #1a1a6e;
    --purple: #8b5cf6;
    --green: #22c55e;
    --green-dark: #16a34a;
    --red: #ef4444;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--sky);
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 3rem;
  }

  .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .cloud { position: absolute; background: white; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: white; }
  .c1 { width: 48px; height: 16px; top: 12%; left: 5%; animation: cloudMove 18s linear infinite; }
  .c1::before { width: 24px; height: 16px; top: -12px; left: 8px; }
  .c1::after { width: 16px; height: 12px; top: -8px; left: 24px; }
  .c2 { width: 96px; height: 24px; top: 8%; left: 55%; animation: cloudMove 26s linear infinite 4s; }
  .c2::before { width: 48px; height: 24px; top: -18px; left: 16px; }
  .c2::after { width: 32px; height: 16px; top: -10px; left: 52px; }

  @keyframes cloudMove {
    0% { transform: translateX(-200px); }
    100% { transform: translateX(110vw); }
  }

  .content { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 1rem; }

  .header {
    background: var(--cream);
    border: 6px solid var(--navy);
    box-shadow: 8px 8px 0 var(--navy);
    padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .back-btn {
    background: var(--navy);
    color: var(--yellow);
    border: 3px solid var(--yellow);
    box-shadow: 3px 3px 0 #000;
    padding: 0.5rem 0.8rem;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .header-title { font-size: 0.7rem; color: var(--navy); }

  .search-container { margin-bottom: 1.5rem; }
  .search-box {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 4px solid var(--navy);
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--navy);
    box-shadow: 6px 6px 0 var(--navy);
    outline: none;
  }

  .term-card {
    background: var(--cream);
    border: 4px solid var(--navy);
    box-shadow: 6px 6px 0 var(--navy);
    margin-bottom: 1.2rem;
    padding: 1.2rem;
  }
  .term-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.8rem;
    border-bottom: 3px dashed var(--navy);
    padding-bottom: 0.6rem;
  }
  .term-name { font-family: 'Noto Sans KR', sans-serif; font-size: 1.1rem; font-weight: 900; color: var(--navy); }
  .term-category { font-family: 'Press Start 2P', monospace; font-size: 0.45rem; background: var(--navy); color: var(--yellow); padding: 4px 8px; border: 2px solid #000; }
  .term-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 0.9rem; color: #333; line-height: 1.6; font-weight: 400; }
  .term-source { margin-top: 0.8rem; text-align: right; font-family: 'Noto Sans KR', sans-serif; font-size: 0.75rem; color: #666; font-weight: 700; }

  .status-box {
    background: var(--cream);
    border: 4px solid var(--navy);
    box-shadow: 6px 6px 0 var(--navy);
    padding: 3rem 1rem;
    text-align: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="bg">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
</div>

<div class="content">
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">◀ HOME</a>
      <div class="header-title">📖 DICTIONARY</div>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 검색할 경제/시사 용어를 입력하세요..." oninput="filterTerms()">
  </div>

  <div id="termsContainer">
    <div class="status-box">용어 데이터를 불러오는 중입니다...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://yhmswitflnujcwpkibso.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobXN3aXRmbG51amN3cGtpYnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTIwMDksImV4cCI6MjA5NjM2ODAwOX0.K8HGusLahpyKYqn2vkuxjwBFLIu1w_kCSCyZP75MXfc';

  let allTerms = [];

  async function loadTerms() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/Quiz?select=question,explanation,category&order=id.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await response.json();
      allTerms = data;
      renderTerms(allTerms);
    } catch (error) {
      document.getElementById('termsContainer').innerHTML = `<div class="status-box">데이터를 불러오지 못했습니다.</div>`;
    }
  }

  function renderTerms(list) {
    const container = document.getElementById('termsContainer');
    if (!list || list.length === 0) {
      container.innerHTML = `<div class="status-box">검색 결과가 없습니다 🥲</div>`;
      return;
    }

    container.innerHTML = list.map(item => {
      let termTitle = item.question.split('란')[0].trim();
      if (termTitle.length > 25) termTitle = item.category || '시사 경제 용어';

      return `
        <div class="term-card">
          <div class="term-header">
            <span class="term-name">${termTitle}</span>
            <span class="term-category">${item.category || 'ECONOMY'}</span>
          </div>
          <div class="term-desc">${item.explanation}</div>
          <div class="term-source">출처: 인포맥스</div>
        </div>
      `;
    }).join('');
  }

  function filterTerms() {
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allTerms.filter(item => 
      item.question.toLowerCase().includes(keyword) || 
      item.explanation.toLowerCase().includes(keyword) ||
      (item.category && item.category.toLowerCase().includes(keyword))
    );
    renderTerms(filtered);
  }

  loadTerms();
</script>
</body>
</html>
